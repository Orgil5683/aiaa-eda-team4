[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa-eda-team4"
version = "0.1.0"
description = "Ulaanbaatar PM2.5 air quality data analyzer"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AI Academy Team 4" }]
dependencies = ["pandas", "numpy", "matplotlib", "seaborn"]

[tool.setuptools]
packages = ["aiaa_eda_team4"]