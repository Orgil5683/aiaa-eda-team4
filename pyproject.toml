[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa-eda-team4"
version = "0.1.0"
description = "Улаанбаатарын PM2.5 агаарын чанарын өгөгдөлд зориулсан EDA туслах сан (AI Academy, 4-р баг)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AI Academy Team 4" }]
keywords = ["eda", "air-quality", "pm25", "ulaanbaatar", "pandas"]
dependencies = ["pandas", "numpy", "matplotlib", "seaborn"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

[project.urls]
Source = "https://github.com/Orgil5683/aiaa-eda-team4"

[tool.setuptools]
packages = ["aiaa_eda_team4"]
